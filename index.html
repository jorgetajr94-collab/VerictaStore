<script>
    // URL do seu banco de dados configurada
    const DATABASE_URL = 'https://sheetdb.io/api/v1/lho2ozzts7v65';
    
    let PRODUCTS = [];
    const SIZES = ['PP', 'P', 'M', 'G', 'GG', 'XG', 'G1', 'G2'];
    let currentDetailProduct = null;
    let selectedSize = null;
    let detailQty = 1;
    let cart = [];

    // Formatação de Moeda
    function formatMoney(value) {
        return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // ================= INICIALIZAÇÃO E BANCO DE DADOS =================
    document.addEventListener('DOMContentLoaded', () => {
        loadProductsFromDB();
        loadCartFromStorage();
    });

    async function loadProductsFromDB() {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '<p style="text-align:center; padding: 40px; color: var(--text-muted);">Carregando produtos e estoque...</p>';

        try {
            const response = await fetch(DATABASE_URL);
            const data = await response.json();

            PRODUCTS = data.map(item => {
                // Organiza o estoque por tamanho garantindo que será número (ou 0 se vazio/inválido)
                const stockBySize = {
                    'PP': parseInt(item.PP) || 0,
                    'P': parseInt(item.P) || 0,
                    'M': parseInt(item.M) || 0,
                    'G': parseInt(item.G) || 0,
                    'GG': parseInt(item.GG) || 0,
                    'XG': parseInt(item.XG) || 0,
                    'G1': parseInt(item.G1) || 0,
                    'G2': parseInt(item.G2) || 0,
                    'U': parseInt(item.U) || 0
                };

                // Soma tudo para saber o estoque total do produto
                const totalStock = Object.values(stockBySize).reduce((acc, curr) => acc + curr, 0);

                // O preço deve ser lido corretamente mesmo se houver vírgula em vez de ponto
                let rawPrice = item.price ? item.price.toString().replace(',', '.') : '0';

                return {
                    id: parseInt(item.id),
                    name: item.name,
                    category: item.category,
                    price: parseFloat(rawPrice),
                    desc: item.desc,
                    images: [item.image], // Puxa a imagem (nome do arquivo ou URL)
                    stockBySize: stockBySize,
                    totalStock: totalStock
                };
            });

            renderCatalog(PRODUCTS);
        } catch (error) {
            console.error("Erro ao carregar o banco de dados:", error);
            container.innerHTML = '<p style="text-align:center; color: red;">Erro ao carregar produtos. Verifique se as colunas da planilha estão exatamente como o sistema espera.</p>';
        }
    }

    // ================= CATÁLOGO =================
    function renderCatalog(productsToRender) {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '';

        if(productsToRender.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">Nenhum produto encontrado.</p>';
            return;
        }

        productsToRender.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            const isOutOfStock = prod.totalStock <= 0;
            const buttonText = isOutOfStock ? 'ESGOTADO' : 'VER DETALHES';
            const buttonStyle = isOutOfStock ? 'background: #E2E8F0; color: #8F99A3; cursor: not-allowed;' : '';

            if(!isOutOfStock) {
                card.onclick = () => openProductDetails(prod.id);
            }
            
            card.innerHTML = `
                <div class="card-img-wrapper" style="${isOutOfStock ? 'opacity: 0.5;' : ''}">
                    <span class="card-tag">${prod.category}</span>
                    <img src="${prod.images[0]}" alt="${prod.name}" loading="lazy">
                </div>
                <div class="card-content">
                    <h3 class="card-title">${prod.name}</h3>
                    <div class="card-price">${formatMoney(prod.price)}</div>
                    <div class="card-view-btn" style="${buttonStyle}">${buttonText}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCategory(cat, btnElement) {
        document.querySelectorAll('.cat-tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if (cat === 'all') {
            renderCatalog(PRODUCTS);
        } else {
            const filtered = PRODUCTS.filter(p => p.category === cat);
            renderCatalog(filtered);
        }
    }

    // ================= TRANSIÇÃO DE PÁGINAS =================
    function showCatalogPage() {
        document.getElementById('view-details').classList.remove('active');
        document.getElementById('view-catalog').classList.add('active');
        window.scrollTo(0,0);
    }

    function showDetailsPage() {
        document.getElementById('view-catalog').classList.remove('active');
        document.getElementById('view-details').classList.add('active');
        window.scrollTo(0,0);
    }

    // ================= DETALHES DO PRODUTO =================
    function openProductDetails(id) {
        const product = PRODUCTS.find(p => p.id === id);
        if(!product || product.totalStock <= 0) return; 
        
        currentDetailProduct = product;
        detailQty = 1;
        selectedSize = null;

        document.getElementById('bread-category').textContent = product.category;
        document.getElementById('bread-name').textContent = product.name;
        document.getElementById('detail-badge').textContent = product.category;
        document.getElementById('detail-title').textContent = product.name;
        document.getElementById('detail-price').textContent = formatMoney(product.price);
        document.getElementById('detail-desc').textContent = product.desc;
        document.getElementById('detail-qty').value = detailQty;

        const mainImg = document.getElementById('detail-main-img');
        mainImg.src = product.images[0];
        document.getElementById('detail-thumbnails').innerHTML = ''; // Limpa thumbs (se houver)

        // Renderização inteligente de Tamanhos
        const sizesContainer = document.getElementById('detail-sizes');
        sizesContainer.innerHTML = '';
        
        if (product.category !== 'acessorios') {
            let firstAvailableSize = null;

            SIZES.forEach(size => {
                const stockOfThisSize = product.stockBySize[size];
                const chip = document.createElement('div');
                
                // Se tiver estoque, botão normal
                if (stockOfThisSize > 0) {
                    if (!firstAvailableSize) firstAvailableSize = size; 
                    
                    chip.className = 'size-chip size-selectable';
                    chip.textContent = size;
                    chip.onclick = () => {
                        selectedSize = size;
                        detailQty = 1; // Reseta quantidade ao trocar tamanho
                        document.getElementById('detail-qty').value = detailQty;
                        document.querySelectorAll('.size-selectable').forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                    };
                } else {
                    // Se não tiver estoque, botão riscado e bloqueado
                    chip.className = 'size-chip';
                    chip.textContent = size;
                    chip.style.opacity = '0.3';
                    chip.style.cursor = 'not-allowed';
                    chip.style.textDecoration = 'line-through';
                    chip.style.background = '#F8FAFC';
                }
                sizesContainer.appendChild(chip);
            });

            // Seleciona automaticamente o primeiro tamanho disponível
            if(firstAvailableSize) {
                selectedSize = firstAvailableSize;
                const firstChip = Array.from(sizesContainer.children).find(c => c.textContent === firstAvailableSize);
                if(firstChip) firstChip.classList.add('selected');
            }

        } else {
            // Acessórios -> Tamanho Único
            const stockOfU = product.stockBySize['U'];
            if(stockOfU > 0) {
                sizesContainer.innerHTML = `<div class="size-chip selected size-selectable">Tamanho Único</div>`;
                selectedSize = 'U';
            }
        }

        showDetailsPage();
    }

    function changeDetailQty(amount) {
        if (!selectedSize) return;

        const maxStockForSelectedSize = currentDetailProduct.stockBySize[selectedSize];
        let newQty = detailQty + amount;

        if (newQty >= 1 && newQty <= maxStockForSelectedSize) {
            detailQty = newQty;
            document.getElementById('detail-qty').value = detailQty;
        } else if (newQty > maxStockForSelectedSize) {
            alert(`Temos apenas ${maxStockForSelectedSize} unidades do tamanho ${selectedSize} em estoque.`);
        }
    }

    function addToCartFromDetail() {
        if(!currentDetailProduct || !selectedSize) {
            alert("Por favor, selecione um tamanho.");
            return;
        }

        const maxStockForSelectedSize = currentDetailProduct.stockBySize[selectedSize];

        const cartItem = {
            cartId: Date.now() + Math.random(), 
            productId: currentDetailProduct.id,
            name: currentDetailProduct.name,
            price: currentDetailProduct.price,
            img: currentDetailProduct.images[0],
            size: selectedSize,
            qty: detailQty
        };

        const existingIndex = cart.findIndex(item => item.productId === cartItem.productId && item.size === cartItem.size);
        
        if(existingIndex >= 0) {
            const totalRequested = cart[existingIndex].qty + cartItem.qty;
            if(totalRequested > maxStockForSelectedSize) {
                alert(`Você já tem algumas unidades no carrinho. O limite para o tamanho ${selectedSize} é ${maxStockForSelectedSize} unidades.`);
                return;
            }
            cart[existingIndex].qty += cartItem.qty;
        } else {
            cart.push(cartItem);
        }

        saveCart();
        updateCartUI();
        showToast();
    }

    // ================= CARRINHO =================
    function openCart() { document.getElementById('cart-overlay').classList.add('open'); }
    function closeCart() { document.getElementById('cart-overlay').classList.remove('open'); }

    function removeCartItem(cartId) {
        cart = cart.filter(item => item.cartId !== cartId);
        saveCart();
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cart-items-container');
        const headerCount = document.getElementById('cart-header-count');
        const badgeCount = document.getElementById('cart-count');
        const totalElement = document.getElementById('cart-total-value');

        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        headerCount.textContent = totalItems;
        badgeCount.textContent = totalItems;

        const totalValue = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        totalElement.textContent = formatMoney(totalValue);

        container.innerHTML = '';

        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart-view">Seu carrinho está vazio.<br><br><button class="cat-tab-btn active" onclick="closeCart()">Continuar Comprando</button></div>`;
            return;
        }

        cart.forEach(item => {
            const row = document.createElement('div');
            row.className = 'cart-item-row';
            row.innerHTML = `
                <img src="${item.img}" class="cart-item-img" alt="${item.name}">
                <div class="cart-item-info">
                    <div class="cart-item-title">${item.name}</div>
                    <div class="cart-item-meta">Tam: ${item.size} | Qtd: ${item.qty}</div>
                    <div class="cart-item-price">${formatMoney(item.price * item.qty)}</div>
                </div>
                <button style="background:none; border:none; color:#EF4444; cursor:pointer;" onclick="removeCartItem(${item.cartId})">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                </button>
            `;
            container.appendChild(row);
        });
    }

    function saveCart() { localStorage.setItem('vericta_cart', JSON.stringify(cart)); }

    function loadCartFromStorage() {
        const saved = localStorage.getItem('vericta_cart');
        if (saved) {
            try {
                cart = JSON.parse(saved);
                updateCartUI();
            } catch(e) { console.error("Erro ao carregar carrinho"); }
        }
    }

    // ================= CHECKOUT WHATSAPP =================
    function checkoutWhatsApp() {
        if (cart.length === 0) {
            alert("Seu carrinho está vazio!");
            return;
        }

        const name = document.getElementById('cust-name').value.trim() || "Cliente";
        const cep = document.getElementById('cust-cep').value.trim() || "Não informado";
        const deliverySelect = document.getElementById('cust-delivery');
        const delivery = deliverySelect.options[deliverySelect.selectedIndex].text;

        let text = `*NOVO PEDIDO - VERICTA SPORTSWEAR* 🏆\n\n`;
        text += `*Cliente:* ${name}\n`;
        text += `*CEP:* ${cep}\n`;
        text += `*Entrega:* ${delivery}\n\n`;
        text += `*ITENS DO PEDIDO:*\n`;

        let total = 0;
        cart.forEach((item, index) => {
            const sub = item.price * item.qty;
            total += sub;
            text += `${index + 1}. ${item.name}\n`;
            text += `   Tamanho: *${item.size}* | Qtd: *${item.qty}* | Sub: ${formatMoney(sub)}\n`;
        });

        text += `\n*TOTAL DOS PRODUTOS:* ${formatMoney(total)}\n`;
        text += `\n_Aguardo o cálculo do frete e os dados para pagamento._`;

        const encodedText = encodeURIComponent(text);
        const phone = "5515991347011"; 
        
        const whatsappUrl = `https://wa.me/${phone}?text=${encodedText}`;
        window.open(whatsappUrl, '_blank');
    }

    // ================= UTILIDADES =================
    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
</script>
